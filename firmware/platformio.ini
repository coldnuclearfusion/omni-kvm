; ============================================================
; Omni-KVM Firmware — PlatformIO Configuration
; ============================================================
; Board: ESP32-S3-DevKitC-1-N8R8
; Framework: Arduino core 2.0.17 on ESP-IDF 4.4 (docs/platform.md, section 3)
; ============================================================

[platformio]
; Build only the real firmware by default; the other environments
; below are built on request (pio run -e bench_none, ...).
default_envs = esp32s3

[env:esp32s3]
; Pinned: firmware/src/usb_guard.cpp works around defects in exactly this
; platform's Arduino core and USB driver (docs/platform.md, K1-K7). Check
; them again before moving to another version.
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

; --- USB Configuration ---
; The ESP32-S3 has two USB controllers that share the "USB" port:
;   - USB-Serial/JTAG: fixed-function, serial + flashing only
;   - USB-OTG (driven by TinyUSB): can act as any USB device; here a
;     keyboard + mouse (HID) plus a serial port (CDC) for the daemon.
; ARDUINO_USB_MODE=0 selects USB-OTG. The board definition sets it
; to 1, so build_unflags removes that first.
; ARDUINO_USB_CDC_ON_BOOT=0 routes Serial to UART0, i.e. the "UART"
; port. Uploads, the log and development commands go through the UART
; port while the "USB" port belongs to the board's own computer.
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; --- Serial Monitor ---
; Baud rate for the serial monitor (View → Serial Monitor in VSCode)
monitor_speed = 115200

; --- Upload ---
; Auto-detect upload port. If this fails, you can set it manually:
; upload_port = /dev/ttyACM0    (Linux/Mac)
; upload_port = COM3            (Windows)

; --- Latency benchmark builds (Phase 2) ---
; Same firmware without our authenticated encryption (see
; secure_packet.h). For measuring latency only: they must never carry
; real input.
[env:bench_none]
extends = env:esp32s3
build_flags = ${env:esp32s3.build_flags} -DOMNI_RADIO_CRYPTO=0

[env:bench_espnow]
extends = env:esp32s3
build_flags = ${env:esp32s3.build_flags} -DOMNI_RADIO_CRYPTO=2

; --- Replay attack test (Phase 2; shared/protocol.md, "Sessions") ---
; This board records one of its own sealed heartbeats and later re-sends
; the recording raw; the other board (normal firmware) logs what happened.
[env:test_replay]
extends = env:esp32s3
build_flags = ${env:esp32s3.build_flags} -DOMNI_TEST_REPLAY=1

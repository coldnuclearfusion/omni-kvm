; ============================================================
; Omni-KVM Firmware — PlatformIO Configuration
; ============================================================
; Board: ESP32-S3-DevKitC-1-N8R8
; Framework: Arduino (for rapid prototyping; may migrate to ESP-IDF later)
; ============================================================

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- USB Configuration ---
; The ESP32-S3 has two USB controllers that share the "USB" port:
;   - USB-Serial/JTAG: fixed-function, serial + flashing only (Phase 0)
;   - USB-OTG (driven by TinyUSB): can act as any USB device,
;     e.g. a keyboard + mouse (HID). Needed from Phase 1 on.
; ARDUINO_USB_MODE=0 selects USB-OTG. The board definition sets it
; to 1, so build_unflags removes that first.
; ARDUINO_USB_CDC_ON_BOOT=0 routes Serial to UART0, i.e. the "UART"
; port. Uploads and debug output go through the UART port while the
; "USB" port acts as the keyboard/mouse.
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; --- Serial Monitor ---
; Baud rate for the serial monitor (View → Serial Monitor in VSCode)
monitor_speed = 115200

; --- Upload ---
; Auto-detect upload port. If this fails, you can set it manually:
; upload_port = /dev/ttyACM0    (Linux/Mac)
; upload_port = COM3            (Windows)

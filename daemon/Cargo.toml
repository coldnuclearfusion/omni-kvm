[package]
name = "omni-kvm-daemon"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Omni-KVM host daemon: shares one keyboard-and-mouse focus between two computers through the boards"
publish = false

[[bin]]
name = "omni-kvm"
path = "src/main.rs"

[dependencies]
serialport = "4"

[target.'cfg(windows)'.dependencies]
windows-sys ={ version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[profile.release]
# Small binaries matter: the installers are meant to fit on the board's
# own flash (Phase 6).
lto = true
codegen-units = 1
strip = true
# A half-dead input daemon (a thread gone while the hooks or event tap stay
# installed) is worse than none: any panic ends the whole process.
panic = "abort"
